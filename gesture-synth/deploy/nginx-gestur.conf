# ============================================================================
# Nginx server block — GESTURE SYNTH
# Domain   : gestur.geodfine.my.id
# Mode     : Static site, di-expose ke internet lewat Cloudflare Tunnel
#            (cloudflared). Nginx TIDAK perlu mendengarkan di port 80/443
#            publik — cukup di localhost, karena SSL/HTTPS ke pengunjung
#            sudah otomatis diurus oleh Cloudflare di tepi jaringan (edge).
#
# Lokasi file di VPS  : /etc/nginx/sites-available/gestur.conf
# Simlink ke          : /etc/nginx/sites-enabled/gestur.conf
# ============================================================================

server {
    # Dengarkan hanya di localhost. cloudflared akan menembak ke port ini.
    listen 127.0.0.1:8095;
    listen [::1]:8095;

    server_name gestur.geodfine.my.id;

    root /var/www/gestur-synth;
    index index.html;

    # --------------------------------------------------------------------
    # Header keamanan & kompatibilitas Web Audio API / getUserMedia (webcam)
    # --------------------------------------------------------------------

    # Izinkan akses kamera untuk origin situs ini sendiri.
    # (Tanpa header ini browser tetap akan meminta izin kamera seperti biasa;
    # header ini eksplisit membuka izin agar tidak diblok oleh Permissions-Policy
    # default di beberapa browser/proxy.)
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Amankan dari clickjacking & MIME sniffing, tanpa mengganggu AudioContext/WebGL.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Web Audio API & AudioWorklet berjalan normal tanpa header khusus selama
    # halaman disajikan lewat HTTPS (secure context) — yang diurus Cloudflare.
    # Jika di kemudian hari menambahkan AudioWorklet/WASM multi-thread yang
    # butuh SharedArrayBuffer, aktifkan 2 baris berikut (uji dulu, bisa
    # memblokir skrip pihak ketiga yang tidak mengirim header CORP/CORS):
    # add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # --------------------------------------------------------------------
    # Kompresi & caching aset statis
    # --------------------------------------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache lama agar update aplikasi langsung terlihat.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nonaktifkan log akses verbose untuk file kecil (opsional)
    access_log /var/log/nginx/gestur.access.log;
    error_log  /var/log/nginx/gestur.error.log;
}
