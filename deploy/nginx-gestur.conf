# ============================================================================
# Nginx server block GEOGESTPLAY
# ============================================================================

server {
    
    listen 127.0.0.1:8095;
    listen [::1]:8095;

    server_name gestur.geodfine.my.id;

    root /var/www/gestur-synth;
    index index.html;


    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;


    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;



    # --------------------------------------------------------------------
    # Kompresi 
    # --------------------------------------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

  
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

  
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }


    access_log /var/log/nginx/gestur.access.log;
    error_log  /var/log/nginx/gestur.error.log;
}
