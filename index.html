<body>

<div class="rack" id="rack">

  <header class="panel-header">
    <div class="brand">
      <img class="brand-mark" src="assets/logo-256.png" alt="Logo GeoGestPlay" />
      <div class="brand-text">
        <h1>GeoGestPlay</h1>
        <p class="subtitle">piano &middot; dimainkan dengan hitungan jari</p>
      </div>
    </div>
    <div class="status-readout" id="statusReadout">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">KAMERA OFF</span>
    </div>
  </header>

  <main class="stage">

    <section class="scope" aria-label="Tampilan kamera dan deteksi tangan">
      <div class="scope-frame">
        <video id="inputVideo" playsinline autoplay muted></video>
        <canvas id="overlayCanvas"></canvas>

        <div class="scope-empty" id="scopeEmpty">
          <p>Tekan <strong>Start Kamera</strong> untuk mulai bermain.</p>
          <p class="hint">Izinkan akses webcam saat diminta oleh browser.</p>
        </div>
      </div>
